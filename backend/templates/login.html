<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Acceso · AlertAR</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon-32.png') }}" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static',filename='panel.css') }}">
</head>
<body class="login-page">
  <main class="login">
    <div class="brand">
      <img class="brand-mark" src="{{ url_for('static', filename='logo.png') }}" alt="" width="40" height="40">
      <div>
        <p class="brand-name">AlertAR</p>
        <p class="brand-sub">Control de pasos a nivel</p>
      </div>
    </div>
    <section class="login-card">
      <h1>Ingresar</h1>
      <form method="post" class="form">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <label class="field" for="clave">
          <span>Clave de acceso</span>
          <input id="clave" name="clave" type="password" maxlength="256" required autocomplete="current-password">
        </label>
        {% if error %}<p role="alert" class="form-error">{{ error }}</p>{% endif %}
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      </form>
      <p class="login-note">Solo para administradores. La sesión vence a las 8 horas.</p>
      <p class="login-note"><a href="{{ url_for('panel') }}">Volver al panel</a></p>
    </section>
  </main>
</body>
</html>
